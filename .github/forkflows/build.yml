name: Build Server Binary

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build owpengram-server
        run: go build -o owpengram-server ./cmd/telesrv

      - name: Build owpengram-ctl (if exists)
        run: |
          if [ -d "./cmd/owpengram-ctl" ]; then
            go build -o owpengram-ctl ./cmd/owpengram-ctl
          fi
        continue-on-error: true

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: server-binaries
          path: |
            owpengram-server
            owpengram-ctl
